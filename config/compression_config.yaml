# Context Compressor Skill Configuration
# 上下文压缩技能配置
# 版本: 1.1.0
# 更新时间: 2026-03-11

# 压缩策略配置
compression_strategy:
  # 触发时机：每次对话后立即检查
  trigger_timing: "after_conversation"
  
  # 阈值配置
  thresholds:
    warning: 0.85    # 85%：预警级别
    execution: 0.90  # 90%：执行压缩级别
  
  # 上下文限制（根据OpenClaw日志）
  context_limits:
    max_chars: 98304        # 最大字符数
    warning_chars: 83558    # 85%警告线 (98304 * 0.85)
    compress_chars: 88474   # 90%压缩线 (98304 * 0.90)
  
  # 防冲突机制
  conflict_prevention:
    check_openclaw_compression: true  # 检查OpenClaw是否已在压缩
    min_interval_seconds: 300         # 最小压缩间隔：5分钟
    skip_if_recently_compressed: true # 如果最近已压缩则跳过

# 压缩算法配置
algorithm:
  method: "intelligent_summary"
  preserve_items:
    - "key_instructions"     # 保留关键指令
    - "important_decisions"  # 保留重要决策
    - "system_commands"      # 保留系统命令
  remove_items:
    - "redundant_greetings"  # 删除冗余问候
    - "confirmation_messages" # 删除确认消息
    - "repetitive_content"   # 删除重复内容

# 日志和监控
monitoring:
  log_dir: "./logs"
  enable_real_time_monitoring: true
  check_interval_seconds: 60  # 检查间隔：60秒
  alert_on_warning: true      # 达到警告阈值时提醒

# 集成配置
integration:
  with_openclaw: true
  with_memory_manager: true
  with_smart_reminder: true
